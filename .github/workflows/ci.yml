name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cyberrp
          POSTGRES_PASSWORD: cyberrp_test
          POSTGRES_DB: cyberrp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyberrp -d cyberrp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://cyberrp:cyberrp_test@localhost:5432/cyberrp_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build C# resource host
        run: dotnet build server/src/runtime/hosts/csharp/CyberRP.CSharpHost.csproj --configuration Release
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Type check server runtimes
        run: npm run typecheck:server
      - name: Build renderer
        run: npm run build
      - name: Build directory API
        run: npm run api:build
      - name: Test PostgreSQL registry
        run: npm run test:postgres
